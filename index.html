<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>HoloKnight: The Ogre's Abyss</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="tela-inicial">
        <div class="menu-container">
            <h1 class="titulo-jogo">HOLO<span>KNIGHT</span></h1>
            <button id="btn-iniciar" class="btn-menu">INICIAR SIMULADOR</button>
        </div>
    </div>
    <div id="game-hud" class="hidden">
        <div class="hud-box">
            <div class="hp-container"><div id="bar-player-hp" class="hp-bar"></div></div>
            <div class="hp-container stamina-container"><div id="bar-player-stamina" class="hp-bar stamina-bar"></div></div>
        </div>
        <div class="combat-ui">
            <div id="combo-counter" class="hidden">COMBO: x<span id="lbl-combo">0</span></div>
            <div class="info-panel">Arma: <span id="lbl-arma">Lâmina</span> | Poções: <span id="lbl-pocoes">3</span></div>
        </div>
    </div>
    <div id="combat-log" class="hidden">Sistema pronto.</div>
    <div id="reticula" class="hidden"></div>
    <script src="game.js"></script>
</body>
</html>
