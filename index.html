<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Operação Floresta Tática 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #game-hud { position: absolute; top: 20px; left: 20px; color: #fff; pointer-events: none; text-shadow: 1px 1px 2px #000; }
        #tela-inicial { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1a1d1a; z-index: 10; }
        .hidden { display: none !important; }
        .btn { padding: 15px 30px; cursor: pointer; background: #33ff33; border: none; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"></script>
</head>
<body>
    <div id="tela-inicial"><h1 style="color:#fff">FLORESTA TÁTICA</h1><button id="btn-iniciar" class="btn">INICIAR JOGO</button></div>
    <div id="game-hud">FPS: <span id="fps-val"></span></div>
    <script src="game.js"></script>
</body>
</html>
