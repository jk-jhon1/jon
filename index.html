<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Combate 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="tela-inicial">
        <div class="menu-container">
            <h1>SIMULADOR COMBATE 3D</h1>
            <p>Use W, A, S, D para andar, Mouse para olhar e atacar.</p>
            <button id="btn-iniciar">INICIAR SIMULAÇÃO</button>
        </div>
    </div>

    <div id="game-hud" class="hidden">
        <div class="hud-status">
            <div class="hud-label">INTEGRIDADE (HP)</div>
            <div class="barra-container">
                <div id="bar-player-hp"></div>
            </div>
        </div>
        <div class="hud-status">
            <div class="hud-label">ESTÁMINA (STAMINA)</div>
            <div class="barra-container">
                <div id="bar-player-stamina"></div>
            </div>
        </div>
        <div class="hud-info">
            <div>🧪 Seringas (Q): <span id="lbl-pocoes">3</span></div>
            <div>🎒 Itens no Inventário: <span id="lbl-total-itens">0</span>/15</div>
        </div>
        <div class="hud-controles">
            [1][2][3] Mudar Arma | [SHIFT] Dash | [E] Inventário
        </div>
    </div>

    <div id="painel-inventario" class="hidden">
        <div class="inventario-caixa">
            <h2>🎒 ARMAZENAMENTO DE SUCATA</h2>
            <div id="grid-inventario">
                </div>
            <button id="btn-fechar-inv">FECHAR INVENTÁRIO (E)</button>
        </div>
    </div>

    <div id="reticula" class="hidden"></div>
    <div id="combat-log" class="hidden">Aguardando início...</div>
    <div id="travar-mouse-ui" class="hidden">Clique na tela para focar o combate</div>

    <script src="main.js"></script>
</body>
</html>
