<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Action RPG - Performance Edition</title>
    <!-- Busca o arquivo na mesma pasta, eliminando o erro 404 -->
    <link rel="stylesheet" href="style.css">
    <!-- CDN do Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="reticula"></div>

    <div id="travar-mouse-ui">
        CLIQUE PARA INICIAR O SIMULADOR
        <br><span style="font-size: 13px; color: #aaa; margin-top: 10px;">(W, A, S, D | Mouse | Clique Esquerdo: Atacar | Clique Direito: Defender)</span>
    </div>

    <div id="game-hud">
        <!-- Herói -->
        <div class="hud-box player-hud">
            <div class="hud-label">🛡️ CAVALEIRO ALADO</div>
            <div class="hp-container">
                <div id="bar-player-hp" class="hp-bar player-hp"></div>
            </div>
            <div class="hp-texto"><span id="lbl-player-hp">100</span> / 100 HP</div>
        </div>

        <!-- Chefe -->
        <div id="boss-hud" class="hud-box boss-hud hidden">
            <div class="hud-label" id="lbl-monster-name">BARROG, O DESTRUIDOR</div>
            <div class="hp-container">
                <div id="bar-monster-hp" class="hp-bar monster-hp"></div>
            </div>
            <div class="hp-texto"><span id="lbl-monster-hp">500</span> / 500 HP</div>
        </div>
    </div>

    <div id="combat-log">Sistema operacional gráfico iniciado. Pronto para combate.</div>

    <!-- Script na raiz com carregamento deferido seguro -->
    <script defer src="game.js"></script>
</body>
</html>
