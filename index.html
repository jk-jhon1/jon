<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gothic Dark Fantasy RPG</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Importando o Three.js corretamente via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- UI de Exploração (Instrução do Mouse) -->
    <div id="travar-mouse-ui">
        Clique aqui para ativar a câmera e mover!
        <br><span style="font-size: 13px; color: #888;">(Use W, A, S, D para andar e ESC para soltar)</span>
    </div>

    <!-- Tela de Turno / Combate (Escondida por padrão) -->
    <div id="battle-screen" class="hidden">
        <div class="battle-container">
            <h2>⚔️ COMBATE SANGRENTO ⚔️</h2>
            <hr class="divisor">
            
            <div class="battle-flex">
                <!-- Painel do Herói -->
                <div class="fighter-box player-box">
                    <h3>🛡️ Cavaleiro Alado</h3>
                    <div class="hp-container">
                        <div id="bar-player-hp" class="hp-bar player-hp"></div>
                    </div>
                    <p>HP: <span id="lbl-player-hp">100</span> / 100</p>
                    <span id="lbl-player-state" class="state-badge"></span>
                </div>

                <div class="vs">VS</div>

                <!-- Painel do Monstro -->
                <div class="fighter-box monster-box">
                    <h3 id="lbl-monster-name">Barrog, o Destruidor</h3>
                    <div class="hp-container">
                        <div id="bar-monster-hp" class="hp-bar monster-hp"></div>
                    </div>
                    <p>HP: <span id="lbl-monster-hp">180</span> / 180</p>
                    <span id="lbl-monster-state" class="state-badge"></span>
                </div>
            </div>

            <!-- Histórico da Batalha -->
            <div id="battle-log">A escuridão aguarda suas ordens...</div>

            <!-- Botões de Ação -->
            <div class="battle-actions">
                <button onclick="comandar('ataque_leve')">🗡️ Lâminas Rápidas</button>
                <button onclick="comandar('ataque_pesado')">💥 Impacto Supremo</button>
                <button onclick="comandar('defender')">🛡️ Barreira Escura</button>
                <button onclick="comandar('curar')">🧪 Elixir Divino (<span id="lbl-potions">3</span>)</button>
            </div>
        </div>
    </div>

    <!-- O Script do Jogo -->
    <script src="js/game.js"></script>
</body>
</html>
