<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloKnight vs Ogre Esmagador</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="tela-inicial">
        <div class="menu-container">
            <h1 class="titulo-jogo">HOLO<span>KNIGHT</span></h1>
            <p class="subtitulo-jogo">THE OGRE'S ABYSS</p>
            
            <div class="menu-botoes">
                <button id="btn-iniciar" class="btn-menu">INICIAR SIMULADOR</button>
                <button id="btn-opcoes" class="btn-menu btn-secundario">OPÇÕES DA MATRIZ</button>
            </div>
        </div>

        <div id="painel-opcoes" class="hidden">
            <h3>CONFIGURAÇÕES DO SISTEMA</h3>
            <div class="opcao-item">
                <label for="slider-sens">Sensibilidade do Mouse:</label>
                <input type="range" id="slider-sens" min="1" max="5" value="2" step="0.5">
            </div>
            <div class="opcao-item">
                <label for="check-wireframe">Apenas Malha Digital (Wireframe):</label>
                <input type="checkbox" id="check-wireframe">
            </div>
            <button id="btn-fechar-opcoes">SALVAR E VOLTAR</button>
        </div>
    </div>

    <div id="travar-mouse-ui" class="hidden">
        CLIQUE NA TELA PARA RETOMAR O CONTROLE
        <br><span style="font-size: 13px; color: #888; margin-top: 10px;">(W, A, S, D: Mover | Mouse: Olhar | Clique Esquerdo: Atacar | Clique Direito: Defender)</span>
    </div>

    <div id="reticula" class="hidden"></div>

    <div id="game-hud" class="hidden">
        <div class="hud-box player-hud">
            <div class="hud-label">🛡️ HOLOGRAPHIC KNIGHT</div>
            <div class="hp-container">
                <div id="bar-player-hp" class="hp-bar player-hp"></div>
            </div>
            <div class="hp-texto"><span id="lbl-player-hp">100</span> / 100 HP</div>
        </div>

        <div id="boss-hud" class="hud-box boss-hud hidden">
            <div class="hud-label">👹 OGRO ESMAGADOR</div>
            <div class="hp-container">
                <div id="bar-monster-hp" class="hp-bar monster-hp"></div>
            </div>
            <div class="hp-texto"><span id="lbl-monster-hp">500</span> / 500 HP</div>
        </div>
    </div>

    <div id="combat-log" class="hidden">Sistema pronto. Aguardando inicialização...</div>

    <script defer src="game.js"></script>
</body>
</html>
